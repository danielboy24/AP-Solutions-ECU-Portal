name: Unpack portal source
on:
  push:
    paths:
      - '.github/workflows/unpack.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source archive into repository root
        run: |
          set -euo pipefail
          unzip -q AP-Solutions-ECU-Portal-Railway-V2.zip -d /tmp/portal-source
          find /tmp/portal-source -name package.json -print
          SRC=$(dirname "$(find /tmp/portal-source -name package.json | head -n 1)")
          test -f "$SRC/package.json"
          cp -a "$SRC"/. .
          rm AP-Solutions-ECU-Portal-Railway-V2.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Unpack AP Solutions source for Railway" && git push)
